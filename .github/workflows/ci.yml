name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio (sounddevice runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      # `setup-python` resolves the version, `uv` is handed the exact
      # interpreter it produced. Both halves are load-bearing: `3.x` is
      # `setup-python` syntax that `uv` cannot parse ("No interpreter found for
      # executable name `3.x`"), and `uv --python 3` or `--python python3`
      # silently prefers uv's own managed build over the one on PATH, so the
      # "latest" leg would quietly test whatever uv happened to have cached.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python '${{ steps.python.outputs.python-path }}'
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # `flowctl` is named explicitly: it has no .py extension, so mypy's
      # directory walk never reaches it, and it is the one file that runs on
      # every hotkey press.
      - run: uv run mypy flowd flowctl eval
      - run: uv run pytest -q

  # Ubuntu's gtkmm is older than 4.22 and its LTS releases have no
  # gtk4-layer-shell, so CI builds and tests only the GTK-free core. The
  # windows themselves are checked by hand (scripts/check_ui_focus.py).
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored headers
        run: cd ui/third_party && sha256sum -c SHA256SUMS
      - name: Build and test the GTK-free core
        run: |
          cmake -S ui -B build/ui -DFLOWD_UI_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ui -j
          ctest --test-dir build/ui --output-on-failure
